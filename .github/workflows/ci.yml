name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ros2cs-tests:
    name: Jazzy ros2cs tests
    runs-on: ubuntu-24.04
    container:
      # CI is intentionally scoped to the active Jazzy maintenance line.
      # Other distro files are retained for local/manual review, not matrix claims.
      image: ros:jazzy

    env:
      # CI hygiene only: suppress telemetry and SDK banner noise; does not affect build output.
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      # Match the cache path below inside the ros:jazzy container so sccache writes to restored storage.
      SCCACHE_DIR: /github/home/.cache/sccache

    steps:
      - name: Checkout ros2cs
        uses: actions/checkout@v4
        with:
          path: ros2cs_ws/src/ros2cs

      - name: Install workflow dependencies
        run: |
          apt-get update
          apt-get install -y python3-vcstool sccache

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          # Tests/examples use the current preview SDK line while libraries remain netstandard2.0.
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ros2cs_ws/src/ros2cs/**/*.csproj', 'ros2cs_ws/src/ros2cs/**/*.cmake', 'ros2cs_ws/src/ros2cs/**/*.cs', 'ros2cs_ws/src/ros2cs/**/*.xml') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache sccache compiler outputs
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-jazzy-${{ hashFiles('ros2cs_ws/src/ros2cs/ros2_jazzy.repos', 'ros2cs_ws/src/ros2cs/**/CMakeLists.txt', 'ros2cs_ws/src/ros2cs/**/*.cmake', 'ros2cs_ws/src/ros2cs/**/package.xml') }}
          restore-keys: |
            sccache-${{ runner.os }}-jazzy-

      - name: Import source dependencies
        working-directory: ros2cs_ws
        run: |
          vcs import src < src/ros2cs/ros2_jazzy.repos

      - name: Install ROS dependencies
        working-directory: ros2cs_ws
        run: |
          rosdep update
          rosdep install --from-paths src --ignore-src -y

      - name: Build ros2cs tests
        working-directory: ros2cs_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          # Reset counters so the later stats step reports only this build.
          sccache --zero-stats
          # Build the selected test package and all dependencies needed to compile it.
          # --merge-install keeps one install tree, matching the setup.sh sourcing used below.
          colcon build \
            --packages-up-to ros2cs_tests \
            --merge-install \
            --event-handlers console_direct+ \
            --cmake-args \
              -DBUILD_TESTING=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build ros2cs examples
        working-directory: ros2cs_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          # Build examples plus dependencies so the later service/client smoke can run.
          # --merge-install keeps one install tree, matching the setup.sh sourcing used below.
          colcon build \
            --packages-up-to ros2cs_examples \
            --merge-install \
            --event-handlers console_direct+ \
            --cmake-args \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run ros2cs tests
        working-directory: ros2cs_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          find build -type d \( -name test_results -o -name Testing \) -prune -exec rm -rf {} +
          # Keep test-result running even when colcon test fails, so CI logs include per-test diagnostics.
          # Run only these test packages; build used --packages-up-to to compile dependencies.
          # --merge-install matches the build layout and sourced install/setup.sh.
          set +e
          colcon test \
            --packages-select rosidl_generator_cs ros2cs_tests \
            --merge-install \
            --event-handlers console_direct+
          test_exit=$?
          colcon test-result --verbose
          result_exit=$?
          cat > count_colcon_tests.py <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          count = 0
          for path in pathlib.Path("build").rglob("*.xml"):
              try:
                  tree = ET.parse(path)
              except ET.ParseError:
                  continue
              count += len(tree.findall(".//testcase"))
          print(count)
          PY
          if ! test_count=$(python3 count_colcon_tests.py); then
            echo "Failed to count colcon test cases."
            exit 1
          fi
          # GitHub executes this block with POSIX sh, where Bash [[ regex ]] syntax is unavailable.
          case "$test_count" in
            ''|*[!0-9]*)
              echo "Invalid colcon test count: '$test_count'."
              exit 1
              ;;
          esac
          if [ "$test_count" -le 0 ]; then
            echo "No test cases were executed; failing test gate."
            exit 1
          fi
          set -e
          if [ "$test_exit" -ne 0 ]; then
            exit "$test_exit"
          fi
          exit "$result_exit"

      - name: Run service/client example smoke
        working-directory: ros2cs_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          dotnet install/lib/ros2cs_examples/dotnet/ros2cs_service.dll > service.log 2>&1 &
          service_pid=$!
          cleanup() {
            kill "$service_pid" 2>/dev/null || true
            wait "$service_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 2
          timeout 60s dotnet install/lib/ros2cs_examples/dotnet/ros2cs_client.dll > client.log 2>&1
          cat service.log
          cat client.log
          grep -q "Sum = 9" client.log
